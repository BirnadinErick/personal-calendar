version: '3.8'

services:
  app:
    image: node:20-alpine
    container_name: personal-calendar-app
    working_dir: /app
    volumes:
      - .:/app
      # Anonymous volume protects the container's node_modules from host file system overrides
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - WATCHPACK_POLLING=true
    # Installs pnpm dynamically and boots Vite dev server
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install && pnpm dev"
    depends_on:
      - radicale

  radicale:
    image: tomsquest/docker-radicale:latest
    container_name: personal-calendar-radicale
    ports:
      - "5232:5232"
    volumes:
      - ./docker/radicale/data:/data
    restart: unless-stopped
